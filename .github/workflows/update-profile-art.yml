name: Update profile art

on:
  schedule:
    - cron: "0 */6 * * *"   # syncs every 6 hours (and at midnight/daily)
  workflow_dispatch: {}     # allows manual "Run workflow" button
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate contribution heatmap
        run: python scripts/generate_streak_svg.py siddharthkmaharana contrib-heatmap.svg

      - name: Update GitHub stats and dual-mode profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_dual_mode_cards.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg contrib-heatmap.svg scripts/stats_cache.json README.md
          git diff --staged --quiet || git commit -m "chore: auto-sync GitHub stats, streak, and profile cards"
          git push

